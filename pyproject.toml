[project]
name = "school-planner-bot"
version = "2.1.0"
description = "Family school planner with Telegram Mini App, reminders and homework."
authors = [{ name = "School Planner Team" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "aiogram>=3.6,<4.0",
    "asyncpg>=0.29,<1",
    "fastapi>=0.121,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.6,<3",
    "python-dateutil>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.18,<1",
    "SQLAlchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
    "uvloop>=0.19,<1 ; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9,<1",
    "pytest>=8.2,<10",
    "pytest-asyncio>=0.25,<2",
    "httpx>=0.27,<1",
    "playwright>=1.49,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "migrations*"]

[tool.setuptools.package-data]
"app.webapp" = ["static/*", "static/**/*"]
"migrations" = ["*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a disposable PostgreSQL database (TEST_DATABASE_URL)",
    "browser: requires Playwright Chromium (RUN_BROWSER_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "ERA", "W"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]
