[project]
name = "school-planner-bot"
version = "0.1.0"
description = "Telegram bot for managing school schedules with extracurricular activities."
authors = [{ name = "School Planner Team" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "aiogram>=3.6,<4.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "SQLAlchemy>=2.0",
    "uvloop>=0.19 ; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "ERA", "W"]
