<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>School Planner WebApp</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <nav class="tabs">
          <button data-tab="today" class="tab-button active">Сегодня</button>
          <button data-tab="tomorrow" class="tab-button">Завтра</button>
          <button data-tab="week" class="tab-button">Неделя</button>
          <button data-tab="edit" class="tab-button">Редактирование</button>
        </nav>
      </header>
      <main>
        <section id="today-view" class="view active">
          <div class="day-header">
            <div>
              <div id="selected-date" class="date-label"></div>
              <div id="selected-weekday" class="weekday-label"></div>
            </div>
          </div>
          <div id="day-entries" class="entries"></div>
        </section>
        <section id="tomorrow-view" class="view">
          <div class="day-header">
            <div>
              <div id="tomorrow-date" class="date-label"></div>
              <div id="tomorrow-weekday" class="weekday-label"></div>
            </div>
          </div>
          <div id="tomorrow-entries" class="entries"></div>
        </section>
        <section id="week-view" class="view">
          <div id="week-grid" class="week-grid"></div>
        </section>
        <section id="edit-view" class="view">
          <div class="card">
            <p>Выберите день недели:</p>
            <div id="edit-weekdays" class="weekday-picker"></div>
          </div>
          <div class="entries" id="edit-entries"></div>
          <button id="add-entry" class="primary">Добавить запись</button>
        </section>
      </main>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <header class="modal-header">
          <h3 id="modal-title"></h3>
          <button id="modal-close" aria-label="Закрыть">×</button>
        </header>
        <div class="modal-body">
          <form id="entry-form">
            <label>
              Тип
              <select name="type" required>
                <option value="lesson">Урок</option>
                <option value="extra">Внеурочка</option>
              </select>
            </label>
            <label>
              Название
              <input type="text" name="label" required />
            </label>
            <label>
              Локация
              <input type="text" name="location" />
            </label>
            <label>
              Комментарий
              <input type="text" name="subtitle" />
            </label>
            <div class="time-picker">
              <div>
                <p>Начало</p>
                <div id="start-picker" class="scroll-picker"></div>
              </div>
              <div>
                <p>Окончание</p>
                <div id="end-picker" class="scroll-picker"></div>
              </div>
            </div>
            <input type="hidden" name="start_time" />
            <input type="hidden" name="end_time" />
            <button type="submit" class="primary">Сохранить</button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script type="module" src="/static/app.js" defer></script>
  </body>
</html>
